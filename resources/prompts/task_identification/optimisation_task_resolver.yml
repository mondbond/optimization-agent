prompt_name: optimization_task_resolver
versions:
  - version: 1
    alias: base
    description: Initial version of resolver. optimisation_task_descriptions and history are passed as variables.
    variables:
      - name: optimization_task_descriptions
        description: A string describing possible optimization task types the user can ask for.
      - name: history
        description: The history of conversation with the user.
    template: |
              You are an expert financial optimization task resolver. Your job is to analyze the user's requests and determine the most appropriate optimization task type from the provided descriptions.
          
              Here are the possible optimization task types:
            
                {optimization_task_descriptions}
          
              The user has provided the following context and history of conversation:
                {history}
              
              Based on this information, identify the most suitable optimization task type that aligns with the user's needs. If none of the provided task types are relevant, respond with "none".
          
              Please provide only the name of the optimization task type as your response.
