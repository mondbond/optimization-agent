- name: "simple multiple transportation action extraction"
  already_existed_entities: ""
  history:
    - role: "user"
      content: |
        I have suppliers A and B.
  expected_actions:
    - action: "UPDATE"
      resource: "supplier_availability"
      key1: "A"
      key2: ""
      value: ""
    - action: "UPDATE"
      resource: "supplier_availability"
      key1: "B"
      key2: ""
      value: ""

- name: "single consumer update"
  already_existed_entities: ""
  history:
    - role: "user"
      content: |
        I have consumer C that needs 500 items.
  expected_actions:
    - action: "UPDATE"
      resource: "consumer_needs"
      key1: "C"
      key2: ""
      value: "500"

- name: "multiple suppliers with availability"
  already_existed_entities: ""
  history:
    - role: "user"
      content: |
        Suppliers X, Y, and Z. X can produce 10, Y = 20 and Z can only do 1
  expected_actions:
    - action: "UPDATE"
      resource: "supplier_availability"
      key1: "X"
      key2: ""
      value: "10"
    - action: "UPDATE"
      resource: "supplier_availability"
      key1: "Y"
      key2: ""
      value: "20"
    - action: "UPDATE"
      resource: "supplier_availability"
      key1: "Z"
      key2: ""
      value: "1"

- name: "supplier removal"
  already_existed_entities: ""
  history:
    - role: "user"
      content: |
        Remove supplier D from the list.
  expected_actions:
    - action: "REMOVE"
      resource: "supplier_availability"
      key1: "D"
      key2: ""
      value: ""

- name: "no action needed"
  already_existed_entities: "supplier F"
  history:
    - role: "user"
      content: |
        I like this weather
  expected_actions: []
